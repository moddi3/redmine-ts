name: redmine-ts

services:
  redmine70:
    image: redmine:7.0
    ports: ["3070:3000"]

  redmine61:
    image: redmine:6.1
    ports: ["3061:3000"]

  redmine70-subpath:
    image: redmine:7.0
    ports: ["3071:3000"]
    command: ["rails", "server", "-b", "0.0.0.0", "-c", "/subpath.ru"]
    volumes: ["./subpath.ru:/subpath.ru:ro"]
    environment:
      RAILS_RELATIVE_URL_ROOT: /redmine
