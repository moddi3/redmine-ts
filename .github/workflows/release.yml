name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: "24"
      - id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: "24"
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: vp run version-packages

  # Runs on any branch, so a dispatch shows what the next publish from main would contain.
  pack:
    needs: select-mode
    if: needs.select-mode.outputs.mode != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: "24"
      - if: needs.select-mode.outputs.mode == 'version'
        name: apply pending changesets locally, as the Version Packages PR will
        run: vp run version-packages
      - run: vp run -r build
      - id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}
      - name: list the tarballs
        run: |
          for tarball in "$RUNNER_TEMP"/changeset-pack-*/packages/*.tgz; do
            echo "== $tarball"
            tar -tzf "$tarball"
          done

  ci:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: [select-mode, pack, ci]
    if: needs.select-mode.outputs.mode == 'publish' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
      # pnpm tries npm trusted publishing first and falls back to NODE_AUTH_TOKEN when it is set.
      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PNPM_CONFIG_PROVENANCE: "true"
      # When npm refuses the exchange, pnpm only warns on stderr, which changesets drops, and publishes
      # without a token, so the log shows a bare 404. Asking npm directly prints its own reason.
      - if: failure()
        name: explain a refused trusted publishing exchange
        shell: bash
        run: |
          id_token=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          echo "::add-mask::$id_token"
          for manifest in packages/*/package.json; do
            [ "$(jq -r '.private // false' "$manifest")" = true ] && continue
            name=$(jq -r .name "$manifest")
            status=$(curl -s -o "$RUNNER_TEMP/exchange.json" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $id_token" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${name/\//%2F}")
            case "$status" in
              2??) echo "$name: npm accepts this workflow as a trusted publisher, so the publish itself was refused" ;;
              *) echo "::error::$name: npm refused the trusted publishing exchange with $status: $(jq -c 'del(.token?)' "$RUNNER_TEMP/exchange.json" 2>/dev/null || cat "$RUNNER_TEMP/exchange.json")" ;;
            esac
            rm -f "$RUNNER_TEMP/exchange.json"
          done
