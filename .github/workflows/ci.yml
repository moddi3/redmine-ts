name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: checks (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: ${{ matrix.node }}
          cache: true
      - run: vp check
      - run: vp run --no-cache -r test
      - run: vp run -r build
      - run: vp run gen:check
        working-directory: packages/sdk

  # release.yml and weekly.yml run rarely, so a bad expression there would only show at release time.
  # jactionlint runs actionlint's checks, shellcheck on run: scripts, and the security and pinning rules.
  jactionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/jactionlint@1027f0a131ab98bc7e191d995bfa15dbed5bbf8f # v2.2.0

  contract:
    name: contract and runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: "24"
          cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      # The image tags float to the latest patch release, and the weekly workflow relies on this pull.
      - run: docker compose -f docker/compose.yaml pull
      - run: node scripts/redmine-env.ts up
      - run: vp run --no-cache test:contract
        working-directory: packages/sdk
      # The MCP contract suite starts the built CLI with --http.
      - run: vp run -r build
      - run: vp run --no-cache test:contract
        working-directory: packages/mcp
      - name: runtime smoke (node)
        run: node scripts/runtime-smoke.mjs
      - name: runtime smoke (bun)
        run: bun scripts/runtime-smoke.mjs
      # Another client against the built CLI over HTTP. --strict fails on tool schemas a client
      # cannot use. The version is pinned; dlx resolves its dependencies without a lockfile.
      - name: MCP Inspector smoke (http)
        shell: bash
        run: |
          log="$RUNNER_TEMP/mcp-http.log"
          REDMINE_URL=$(jq -r '."7.0".baseUrl' .redmine/env.json) node packages/mcp/dist/cli.mjs --http &> "$log" &
          server=$!
          trap 'kill "$server"; cat "$log"' EXIT
          timeout 15 bash -c 'until curl -s -o /dev/null http://127.0.0.1:3737/mcp; do sleep 0.2; done'
          key=$(jq -r '."7.0".adminKey' .redmine/env.json)
          inspector() {
            vp dlx --silent @modelcontextprotocol/inspector@2.10.1 --cli http://127.0.0.1:3737/mcp \
              --header "X-Redmine-API-Key: $key" "$@"
          }
          inspector --method tools/list --strict > /dev/null
          inspector --method tools/call --tool-name users_current | jq -e '.structuredContent.login == "admin"'
      # A test sees only "Redmine answered 500"; the server's log names the exception.
      - if: failure()
        name: Redmine server errors
        shell: bash
        run: |
          docker compose -f docker/compose.yaml logs --no-color 2>&1 \
            | grep -E -A15 'Completed 500' || echo "no 500 in the Redmine logs"
      - if: always()
        run: node scripts/redmine-env.ts down
